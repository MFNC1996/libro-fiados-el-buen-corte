<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C8202D">
<meta name="description" content="El libro de los fiados de Carnicería El Buen Corte, Loncoche.">
<title>Libro de Fiados · El Buen Corte</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Libro de Fiados">
<link rel="stylesheet" href="estilo.css?v=1">
</head>
<body>

<!-- ============================ entrar ============================ -->
<section id="entrar" class="entrar">
  <img src="logo.png" alt="Carnicería El Buen Corte">
  <h1>El Buen Corte</h1>
  <p class="sub">LONCOCHE · LIBRO DE FIADOS</p>
  <form id="forma-entrar">
    <label class="campo">
      <span class="rotulo">Correo</span>
      <input type="email" id="correo" autocomplete="username" inputmode="email"
             placeholder="elbuencorte@gmail.com" required>
    </label>
    <label class="campo">
      <span class="rotulo">Clave</span>
      <input type="password" id="clave" autocomplete="current-password" required>
    </label>
    <button class="boton rojo ancho" id="btn-entrar" type="submit">ENTRAR</button>
    <p id="error-entrar" class="aviso mal oculto"></p>
  </form>
  <footer>Libro de Fiados · by Macoem</footer>
</section>

<!-- ============================ el libro ============================ -->
<section id="app" class="oculto">
  <header>
    <img src="logo.png" alt="" id="logo-cabecera">
    <div class="nombre"><b>El Buen Corte</b><span>LONCOCHE · LIBRO DE FIADOS</span></div>
    <div class="total"><span>POR COBRAR</span><b id="por-cobrar">$0</b></div>
  </header>
  <div class="franja-verde"></div>
  <div class="franja-roja"></div>
  <div id="aviso" class="aviso oculto"></div>

  <div class="doble">
    <!-- ---------------------------- lista de clientes ---------------------------- -->
    <section class="panel" id="panel">
      <div class="buscador">
        <input type="text" id="buscar" placeholder="Buscar cliente..." autocomplete="off">
      </div>
      <div class="buscador">
        <button class="boton rojo ancho" id="btn-nuevo">+&nbsp; Nuevo cliente</button>
      </div>
      <div class="buscador" style="padding-bottom:8px">
        <label style="color:var(--suave); font-size:13px">
          <input type="checkbox" id="solo-deben"> Solo los que deben
        </label>
      </div>
      <div class="lista" id="lista"></div>
    </section>

    <!-- ---------------------------- hoja del cliente ---------------------------- -->
    <section class="hoja oculto" id="hoja">
      <button class="volver" id="btn-volver">‹ &nbsp;Volver a la lista</button>

      <div class="tarjeta ficha">
        <p class="nombre" id="h-nombre"></p>
        <p class="datos" id="h-datos"></p>
        <div class="deuda">
          <div>
            <span class="rotulo" id="h-rotulo">Debe</span>
            <div class="monto" id="h-deuda">$0</div>
            <div class="det" id="h-detalle"></div>
          </div>
        </div>
        <div class="acciones">
          <button class="boton chico" id="btn-editar">Editar</button>
          <button class="boton chico" id="btn-whatsapp">WhatsApp</button>
          <button class="boton chico" id="btn-quitar">Quitar</button>
        </div>
        <div class="acciones">
          <button class="boton" id="btn-pago-todo">Pagó todo</button>
          <button class="boton verde" id="btn-abonar">ABONAR</button>
        </div>
      </div>

      <div class="tarjeta anotar">
        <span class="rotulo">Anotar lo que lleva</span>
        <div class="campos">
          <input type="text" id="a-fecha" placeholder="hoy" autocomplete="off">
          <input type="text" id="a-monto" placeholder="$" inputmode="numeric" autocomplete="off">
          <input type="text" id="a-detalle" class="largo" autocomplete="off"
                 placeholder="Ej: 1 kg de molida, 2 chuletas">
          <button class="boton rojo largo" id="btn-anotar">ANOTAR</button>
        </div>
        <p class="ayuda" id="a-ayuda">La fecha vacía es hoy. Los puntos de los miles se marcan solos.</p>
      </div>

      <div class="pestanas">
        <button data-pestana="compras" class="activa" id="p-compras">Compras</button>
        <button data-pestana="pagos" id="p-pagos">Pagos y abonos</button>
      </div>

      <div id="caja-compras">
        <div class="filtros">
          <button data-filtro="pendientes" class="activa">Por pagar</button>
          <button data-filtro="todas">Todas</button>
          <button data-filtro="pagadas">Pagadas</button>
        </div>
        <div class="lista" id="compras"></div>
      </div>
      <div id="caja-pagos" class="oculto">
        <div class="lista" id="pagos"></div>
      </div>
    </section>
  </div>
  <footer>Libro de Fiados · by Macoem · <a href="#" id="salir" style="color:inherit">cerrar sesión</a></footer>
</section>

<div id="ventanita"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="libro.js?v=1"></script>
</body>
</html>
